name: Release

on:
  push:
    tags:
      - "[0-9][0-9].[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload the packages to
        required: true
        default: "26.8"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        run: node -e "if (!/^\d{2}\.(?:[1-9]|1[0-2])(?:\.[1-9]\d*)?$/.test(process.env.RELEASE_TAG) || (require('./package.json').addonVersion || require('./package.json').version) !== process.env.RELEASE_TAG) process.exit(1)"
      - run: npm run lint
      - run: npm test

  thunderbird-and-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gulp -- "wx:package-xpi"
      - run: npm run gulp -- "web:package-zip"
      - uses: actions/upload-artifact@v6
        with:
          name: thunderbird-and-web
          path: |
            build/sieve-NG-*.xpi
            build/sieve-NG-*-web.zip
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: npm run gulp -- "app:zip-win32"
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI installer
        shell: pwsh
        run: |
          $appDir = Get-ChildItem "build/electron/out" -Directory |
            Where-Object { $_.Name -like "*-win32-x64" } |
            Select-Object -First 1

          if (-not $appDir) {
            throw "Kein entpackter Windows-Build unter build/electron/out gefunden."
          }

          $baseName = $appDir.Name -replace "-win32-x64$", ""
          $expectedExe = Join-Path $appDir.FullName "$baseName.exe"

          if (Test-Path $expectedExe) {
            $appExe = Get-Item $expectedExe
          } else {
            $appExe = Get-ChildItem $appDir.FullName -File -Filter "*.exe" |
              Where-Object { $_.Name -ne "chrome_crashpad_handler.exe" } |
              Select-Object -First 1
          }

          if (-not $appExe) {
            throw "Die Haupt-EXE im Windows-Build wurde nicht gefunden."
          }

          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $version = $env:RELEASE_TAG
          $output = "build/sieve-NG-$version-win32-x64.msi"

          wix build "installer/windows/sieve-ng.wxs" `
            -arch x64 `
            -d "Version=$packageVersion" `
            -d "SourceDir=$($appDir.FullName)" `
            -d "ExeName=$($appExe.Name)" `
            -pdbtype none `
            -out $output

          Get-Item $output | Format-List Name, Length, FullName
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            build/sieve-NG-*-win32-x64.zip
            build/sieve-NG-*-win32-x64.msi
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 desktop-file-utils
      - run: npm run gulp -- "app:zip-linux"
      - run: npm run gulp -- "app:appimage-linux"
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            build/sieve-NG-*-linux-x64.zip
            build/sieve-NG-*-linux-x64.AppImage
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gulp -- "app:zip-macos"
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: build/sieve-NG-*-macos-x64.zip
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: [thunderbird-and-web, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate Thunderbird update manifest
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const version = process.env.RELEASE_TAG; const repository = process.env.GITHUB_REPOSITORY; const base = "https://github.com/" + repository + "/releases"; const update = { addons: { "sieve-ng@hightext.de": { updates: [{ version: version, update_link: base + "/download/" + version + "/sieve-NG-" + version + ".xpi", update_info_url: base + "/tag/" + version, browser_specific_settings: { gecko: { strict_min_version: "128.0", strict_max_version: "154.*" } } }] } } }; fs.writeFileSync("release-assets/update.json", JSON.stringify(update, null, 2) + "\n");'
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lah release-assets/
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "sieve-NG $RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
